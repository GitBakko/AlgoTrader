<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>MANTIS AI · Paper Trading v2 — Variant B (mock)</title>
<link rel="icon" href="mantis-eyes.svg">
<link rel="stylesheet" href="colors_and_type.css">
<style>
  html,body{margin:0;padding:0;background:#0a0e13}
  @keyframes pulseGlow{
    0%{box-shadow:0 0 0 0 currentColor;opacity:1}
    50%{box-shadow:0 0 0 4px transparent;opacity:0.6}
    100%{box-shadow:0 0 0 0 transparent;opacity:1}
  }
  @keyframes pulseEmerg{
    0%,100%{box-shadow:0 0 12px rgba(255,61,87,0.5)}
    50%{box-shadow:0 0 22px rgba(255,61,87,0.85)}
  }
  ::-webkit-scrollbar{width:8px;height:8px}
  ::-webkit-scrollbar-track{background:#0d1117}
  ::-webkit-scrollbar-thumb{background:rgba(0,217,126,.3);border-radius:100px}
  button{cursor:pointer;font-family:var(--mantis-font-mono)}
  button:hover{filter:brightness(1.15)}
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="SignalsAndFeed.jsx"></script>
<script type="text/babel" src="VariantB_Ambitious.jsx"></script>

<script type="text/babel">
function App() {
  return (
    <DesignCanvas initialZoom={0.62}>
      <DCSection id="paper-trading" title="Paper Trading v2 — Variant B (Ambitious cockpit)">
