[pytest]
# Pytest configuration for AlgoTrader AI

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Async support
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

# Coverage configuration
addopts =
    --strict-markers
    --strict-config
    --cov=src
    --cov-report=html
    --cov-report=term-missing
    --cov-report=xml
    --cov-fail-under=70
    -v
    -ra

# Test paths
testpaths = tests

# Markers for test categorization
markers =
    unit: Unit tests (fast, no external dependencies)
    integration: Integration tests (database, API, etc.)
    slow: Slow tests that take more than 1 second
    broker: Tests for broker layer (Capital.com API)
    database: Tests for database layer
    data: Tests for data pipeline and storage
    ml: Tests for ML models
    risk: Tests for risk management module
    features: Tests for feature engineering module
    strategy: Tests for strategy module
    backtest: Tests for backtesting module
    execution: Tests for execution module
    trading: Tests for trading loop and paper trading

# Ignore warnings from dependencies
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::ResourceWarning
