# Tool configuration only. Dependencies live in requirements.txt /
# requirements-dev.txt (pip + venv, pinned from the working venv) — the
# old poetry dependency set was abandoned and removed 2026-06-11.

[project]
name = "algotrader-ai"
version = "0.1.0"
description = "MANTIS AI — AI-powered algorithmic trading platform"
requires-python = ">=3.11,<3.13"

[tool.black]
line-length = 100
target-version = ['py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501",   # line too long, handled by black
    "B008",   # do not perform function calls in argument defaults
    "B904",   # raise-without-from-inside-except (too many to fix now)
    "B905",   # zip-without-explicit-strict (Python 3.10+ style, low risk)
    "C901",   # too complex
    "E402",   # module-import-not-at-top (lazy imports for perf)
    "E741",   # ambiguous variable name (l, O, I)
    "B007",   # unused-loop-control-variable (intentional _ patterns)
    "UP042",  # str+Enum → StrEnum (requires Python 3.11+ migration)
    "UP046",  # non-pep695 generic class
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # Allow unused imports in __init__.py
"src/data/historical_downloader.py" = ["F821"]  # Forward reference in type hint
"src/features/builder.py" = ["F821"]  # Forward reference in type hint

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_generics = false
disallow_subclassing_any = false
disallow_untyped_calls = false
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "torch.*",
    "pytorch_forecasting.*",
    "xgboost.*",
    "lightgbm.*",
    "sklearn.*",
    "yfinance.*",
    "fredapi.*",
    "transformers.*",
]
ignore_missing_imports = true

# NOTE: pytest config lives in pytest.ini (single source of truth) — the
# duplicate [tool.pytest.ini_options] block was removed 2026-06-11 because
# pytest.ini always won and the two had drifted (70% vs 80% cov floor).

[tool.bandit]
# Referenced by .pre-commit-config.yaml (bandit -c pyproject.toml).
exclude_dirs = ["tests", ".venv"]

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/__init__.py",
    "*/migrations/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if TYPE_CHECKING:",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

# ---------------------------------------------------------------------------
# Mutation testing — close-detection v2 plan `calm-questing-quail.md` Step 13.
#
# Runs on Linux CI only (mutmut has no native Windows support — issue #397
# on boxed/mutmut). Local runs on Windows must use WSL.
#
# Budget: <= 5 surviving mutants across `close_detector.py` + `fx.py`. A
# higher count blocks merge; kill by widening tests in the close-detection
# suite (`tests/trading/test_close_detector.py`,
# `tests/trading/test_close_detection.py`,
# `tests/broker/test_fx.py`, `tests/property/`).
#
# Invoke (Linux / WSL):
#     pip install "mutmut>=3.5.0"
#     cd backend
#     mutmut run
#     mutmut results  # expect <= 5 survived
# ---------------------------------------------------------------------------
[tool.mutmut]
paths_to_mutate = [
    "src/trading/close_detector.py",
    "src/broker/fx.py",
]
# Fast inner loop: only the tests that cover the mutated modules.
tests_dir = [
    "tests/trading/test_close_detector.py",
    "tests/trading/test_close_detection.py",
    "tests/broker/test_fx.py",
    "tests/property/test_close_matcher_robustness.py",
]
# Disable coverage plugin in the inner test run — it fights mutmut's own
# instrumentation and slows the run by an order of magnitude.
runner = ".venv/bin/python -m pytest -x --no-cov"
