name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-lint:
    name: Backend Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-dev.txt

      - name: Ruff check
        working-directory: backend
        run: ruff check src/

      - name: Black check
        working-directory: backend
        run: black --check --line-length=100 src/

  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    needs: [backend-lint]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: algotrader
          POSTGRES_USER: algotrader
          POSTGRES_PASSWORD: algotrader_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-dev.txt

      - name: Run tests with coverage
        working-directory: backend
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: algotrader
          POSTGRES_USER: algotrader
          POSTGRES_PASSWORD: algotrader_test
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          ENVIRONMENT: development
          CAPITAL_DEMO_API_KEY: test-key-not-real
          CAPITAL_DEMO_EMAIL: test@test.com
          CAPITAL_DEMO_PASSWORD: test-password
        run: |
          python -m pytest tests/ -v --tb=short \
            --cov=src --cov-report=term-missing -q \
            --override-ini="addopts=" -p no:cacheprovider

  backend-mutation:
    name: Backend Mutation Testing (close-detection v2)
    runs-on: ubuntu-latest
    needs: [backend-tests]
    # Budget: <= 5 surviving mutants across close_detector.py + fx.py.
    # Scaffolded by close-detection v2 Step 13 (plan calm-questing-quail.md).
    # Non-blocking until a baseline is captured on CI; flip
    # `continue-on-error: false` once the budget has been measured.
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies + mutmut
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-dev.txt
          pip install "mutmut>=3.5.0"

      - name: Run mutmut
        working-directory: backend
        env:
          CAPITAL_DEMO_API_KEY: test-key-not-real
          CAPITAL_DEMO_EMAIL: test@test.com
          CAPITAL_DEMO_PASSWORD: test-password
        run: |
          mutmut run || true
          mutmut results | tee mutmut-results.txt

      - name: Enforce surviving-mutant budget
        working-directory: backend
        run: |
          SURVIVED=$(grep -c "^survived" mutmut-results.txt || echo 0)
          echo "Surviving mutants: $SURVIVED (budget: 5)"
          if [ "$SURVIVED" -gt 5 ]; then
            echo "::error::Mutation-test budget exceeded ($SURVIVED > 5)."
            exit 1
          fi

      - name: Upload mutmut results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutmut-results
          path: backend/mutmut-results.txt

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Unit tests (Vitest)
        working-directory: frontend
        run: npx ng test --watch=false

      - name: Build
        working-directory: frontend
        run: npx ng build --configuration=production

  docker-build:
    name: Docker Build Check
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-build]

    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t mantis-backend:test ./backend

      - name: Build frontend image
        run: docker build -t mantis-frontend:test ./frontend
