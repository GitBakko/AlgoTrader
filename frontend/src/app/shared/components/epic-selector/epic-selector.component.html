<c-dropdown>
  <button cButton color="dark" [caret]="true" cDropdownToggle>
    {{ selectedEpic() || 'Select Asset' }}
  </button>
  <ul cDropdownMenu>
    @for (epic of epics(); track epic) {
      <li>
        <a cDropdownItem (click)="onSelect(epic)" [class.active]="epic === selectedEpic()">
          <span class="me-2">{{ epic }}</span>
          @if (marketStatus()[epic]; as status) {
            @if (!status.is_open) {
              <c-badge color="danger" size="sm">CLOSED</c-badge>
            }
          }
        </a>
      </li>
    }
  </ul>
</c-dropdown>
