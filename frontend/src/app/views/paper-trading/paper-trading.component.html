<main class="pt2" role="main" aria-label="Paper Trading cockpit">

  <app-cockpit-header
    pageTitle="Paper Trading"
    [state]="state()"
    [mode]="mode()"
    [lastTickAgo]="lastTickAgo()"
    [stopBusy]="stopBusy()"
    [emergencyBusy]="emergencyBusy()"
    (stopClicked)="onStop()"
    (emergencyClicked)="onEmergency()">
  </app-cockpit-header>

  <section class="pt2-grid" aria-label="Cockpit body">

    <aside class="pt2-rail-left" aria-label="Bot rail">
      <div class="pt2-slot pt2-slot--vitals" data-slot="bot-vitals">
        <span class="pt2-slot__label">Bot Vitals</span>
      </div>
      <div class="pt2-slot pt2-slot--risk" data-slot="risk-gauges">
        <span class="pt2-slot__label">Risk Gauges</span>
      </div>
      <div class="pt2-slot pt2-slot--models" data-slot="models-health">
        <span class="pt2-slot__label">Models Health</span>
      </div>
    </aside>

    <section class="pt2-center" aria-label="Cockpit center">
      <div class="pt2-slot pt2-slot--kpi" data-slot="kpi-strip">
        <span class="pt2-slot__label">KPI Strip · 6 cells</span>
      </div>
      <div class="pt2-slot pt2-slot--positions" data-slot="active-positions">
        <span class="pt2-slot__label">Active Positions Cockpit</span>
      </div>
      <div class="pt2-slot pt2-slot--heatmap" data-slot="signals-heatmap">
        <span class="pt2-slot__label">Signals Heatmap · 21 cells</span>
      </div>
    </section>

    <aside class="pt2-rail-right" aria-label="Live feed rail">
      <div class="pt2-slot pt2-slot--feed" data-slot="live-feed">
        <span class="pt2-slot__label">Live Feed Timeline</span>
      </div>
    </aside>

  </section>

  <footer class="pt2-footer" aria-label="Cockpit footer">
    <span class="pt2-footer__chip">{{ buildTag() }}</span>
    @if (lastTickAgo() !== null) {
      <span class="pt2-footer__chip">tick · {{ lastTickAgo()! | number:'1.1-1' }}s ago</span>
    }
    <span class="pt2-footer__spacer"></span>
    <span class="pt2-footer__chip">PR 1 · chrome</span>
  </footer>

</main>
