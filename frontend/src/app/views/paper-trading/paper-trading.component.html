<main class="pt2" role="main" aria-label="Paper Trading cockpit">

  <app-cockpit-header
    pageTitle="Paper Trading"
    [state]="state()"
    [mode]="mode()"
    [lastTickAgo]="lastTickAgo()"
    [stopBusy]="stopBusy()"
    [emergencyBusy]="emergencyBusy()"
    (stopClicked)="onStop()"
    (emergencyClicked)="onEmergency()">
  </app-cockpit-header>

  <section class="pt2-grid" aria-label="Cockpit body">

    <aside class="pt2-rail-left" aria-label="Bot rail">
      <app-bot-vitals-panel
        [vitals]="botVitals()"
        [heartbeat]="heartbeatNonce()">
      </app-bot-vitals-panel>
      <app-risk-gauge-stack [risk]="riskState()"></app-risk-gauge-stack>
      <app-models-health-panel [health]="modelsHealth()"></app-models-health-panel>
    </aside>

    <section class="pt2-center" aria-label="Cockpit center">
      <app-kpi-strip-compact
        [kpi]="kpiStrip()"
        [currency]="currency()"
        [loading]="isInitialLoading()">
      </app-kpi-strip-compact>

      <app-active-positions-cockpit
        [positions]="positions()"
        [signalsTotal]="kpiStrip().signalsTotal"
        [currency]="currency()"
        [equity]="liveEquity()"
        [loading]="isInitialLoading()"
        (closeRequested)="onClosePosition($event)"
        (detailsRequested)="onPositionDetails($event)">
      </app-active-positions-cockpit>

      <app-signals-heatmap
        [epics]="heatmapEpics()"
        [signals]="tradingSignals()"
        [positions]="brokerPositions()"
        [loading]="telemetryLoading()"
        (cellClicked)="onHeatmapCellClick($event)">
      </app-signals-heatmap>
    </section>

    <aside class="pt2-rail-right" aria-label="Live feed rail">
      <app-live-feed-timeline
        [events]="feedEvents()"
        [loading]="telemetryLoading()"
        (eventClicked)="onFeedEventClick($event)">
      </app-live-feed-timeline>
    </aside>

  </section>

  <app-position-detail-drawer
    [position]="selectedPosition()"
    [currency]="currency()"
    (closed)="onDrawerClosed()">
  </app-position-detail-drawer>

</main>
