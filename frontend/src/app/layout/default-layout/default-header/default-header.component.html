<ng-container>
  <c-container [fluid]="true" class="px-4">
    <button
      [cSidebarToggle]="sidebarId()"
      cHeaderToggler
      class="header-action-btn d-lg-none"
      toggle="visible"
      aria-label="Toggle sidebar navigation"
    >
      <svg cIcon name="cilMenu" size="lg"></svg>
    </button>
    <c-header-nav class="d-none d-md-flex">
      <c-nav-item>
        <a cNavLink routerLink="/dashboard" routerLinkActive="active">Dashboard</a>
      </c-nav-item>
      <c-nav-item>
        <a cNavLink routerLink="/paper-trading" routerLinkActive="active">Paper Trading</a>
      </c-nav-item>
      <c-nav-item>
        <a cNavLink routerLink="/backtest" routerLinkActive="active">Backtest</a>
      </c-nav-item>
    </c-header-nav>

    <c-header-nav class="ms-auto">
      <!-- WS Status -->
      <c-nav-item>
        <span class="ws-status-pill"
          [class.ws-status-pill--connected]="wsConnected()"
          [class.ws-status-pill--disconnected]="!wsConnected()"
          [cTooltip]="wsConnected() ? 'WebSocket connesso' : 'WebSocket disconnesso'">
          <span [class]="wsConnected() ? 'pulse-dot' : 'pulse-dot pulse-dot--danger'"></span>
          <span class="d-none d-lg-inline">{{ wsConnected() ? 'Live' : 'Offline' }}</span>
        </span>
      </c-nav-item>
      <div class="nav-item py-1">
        <div class="vr h-100 mx-2 text-body text-opacity-75"></div>
      </div>
      <!-- Theme Toggle -->
      <ng-container *ngTemplateOutlet="themeDropdown" />
      <div class="nav-item py-1">
        <div class="vr h-100 mx-2 text-body text-opacity-75"></div>
      </div>
      <!-- User Dropdown -->
      <app-user-dropdown />
    </c-header-nav>
  </c-container>
</ng-container>

<ng-template #themeDropdown>
  <c-dropdown alignment="end" variant="nav-item">
    <button [caret]="false" cDropdownToggle aria-label="Open theme picker">
      <svg cIcon [name]="icons()" size="lg"></svg>
    </button>
    <div cDropdownMenu>
      @for (mode of colorModes; track mode.name) {
        <button
          (click)="colorMode.set(mode.name)"
          [active]="colorMode()===mode.name"
          cDropdownItem
          class="d-flex align-items-center"
        >
          <svg cIcon class="me-2" [name]="mode.icon" size="lg"></svg>
          {{ mode.text }}
        </button>
      }
    </div>
  </c-dropdown>
</ng-template>
