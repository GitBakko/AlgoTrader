<!--sidebar-->
<c-sidebar
  #sidebar1="cSidebar"
  class="d-print-none sidebar sidebar-fixed border-end"
  colorScheme="dark"
  id="sidebar1"
  unfoldable
  [visible]="true"
>
  <c-sidebar-header class="border-bottom">
    <c-sidebar-brand routerLink="/dashboard">
      <span class="sidebar-brand-full fw-bold px-3">
        <svg class="mantis-logo-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="28" height="28">
          <polygon points="32,6 52,26 46,58 18,58 12,26" fill="none" stroke="#39FF14" stroke-width="2.5" stroke-linejoin="round"/>
          <ellipse cx="23" cy="28" rx="5.5" ry="7.5" fill="#39FF14" opacity="0.85"/>
          <ellipse cx="41" cy="28" rx="5.5" ry="7.5" fill="#39FF14" opacity="0.85"/>
          <line x1="23" y1="20" x2="13" y2="5" stroke="#39FF14" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
          <line x1="41" y1="20" x2="51" y2="5" stroke="#39FF14" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
        </svg>
        <span class="mantis-brand-text">
          MANTIS AI
          <span class="mantis-brand-sub">ALGO TRADING</span>
        </span>
      </span>
      <span class="sidebar-brand-narrow">
        <svg class="mantis-logo-narrow" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="24" height="24">
          <ellipse cx="11" cy="15" rx="4" ry="5.5" fill="#39FF14" opacity="0.9"/>
          <ellipse cx="21" cy="15" rx="4" ry="5.5" fill="#39FF14" opacity="0.9"/>
          <line x1="11" y1="9" x2="6" y2="2" stroke="#39FF14" stroke-width="1.2" stroke-linecap="round" opacity="0.4"/>
          <line x1="21" y1="9" x2="26" y2="2" stroke="#39FF14" stroke-width="1.2" stroke-linecap="round" opacity="0.4"/>
        </svg>
      </span>
    </c-sidebar-brand>
  </c-sidebar-header>

  <ng-scrollbar pointerEventsMethod="scrollbar" visibility="hover">
    <c-sidebar-nav [navItems]="navItems" dropdownMode="close" compact />
  </ng-scrollbar>

  @if (!sidebar1.narrow) {
    <c-sidebar-footer cSidebarToggle="sidebar1" class="border-top d-none d-lg-flex" toggle="unfoldable" style="cursor: pointer;">
      <button cSidebarToggler aria-label="Toggle sidebar fold"></button>
    </c-sidebar-footer>
  }
</c-sidebar>

<!--main-->
<div class="wrapper d-flex flex-column min-vh-100">
  <!--app-header-->
  <app-default-header
    [cShadowOnScroll]="'sm'"
    class="mb-4 d-print-none header header-sticky p-0 shadow-sm"
    position="sticky"
    sidebarId="sidebar1"
  />
  <!--app-body-->
  <div class="body flex-grow-1">
    <c-container [fluid]="true" class="h-auto px-2 px-sm-3 px-lg-4">
      <router-outlet />
    </c-container>
  </div>
  <!--app footer-->
  <app-default-footer />
</div>
<app-bottom-nav />
<app-toast-container />
<app-confirm-dialog />
<app-signal-audit-drawer />
